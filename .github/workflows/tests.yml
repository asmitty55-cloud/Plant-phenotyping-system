name: Tests and scientific validation

on:
  push:
  pull_request:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run unit and integration tests
        run: python -m pytest tests -q
      - name: Run reference validation
        run: python validate.py --manifest validation/manifest.json --acceptance validation/acceptance.json --report validation/validation_report.json
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plant-validation-report
          path: validation/validation_report.json
          if-no-files-found: warn
